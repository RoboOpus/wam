name: Refresh arXiv Radar

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'RoboOpus/wam'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh candidate pool
        run: npm run papers:fetch

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/arxiv/papers.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build static site
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Commit candidate update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "RoboOpus Radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/arxiv/papers.json
          git commit -m "chore(radar): refresh arXiv candidates"
          git push

      - name: Finalize index provenance and verify search
        if: steps.changes.outputs.changed == 'true'
        run: |
          node --experimental-strip-types scripts/build-search-index.mjs
          npm test

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: needs.refresh.outputs.changed == 'true'
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
